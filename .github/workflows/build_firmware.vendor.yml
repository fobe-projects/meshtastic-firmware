name: Vendor Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      platform:
        required: true
        type: string
      pio_env:
        required: true
        type: string

permissions:
  contents: read

jobs:
  pio-build:
    name: build-${{ inputs.platform }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{github.event.pull_request.head.ref}}
          repository: ${{github.event.pull_request.head.repo.full_name}}

      - name: Build ${{ inputs.platform }}
        id: build
        env:
          MT_PLATFORM: ${{ inputs.platform }}
          MT_ENV: ${{ inputs.pio_env }}
          MT_TARGET: build
          PLATFORMIO_BUILD_DIR: /workspace/.pio/build
        run: |
          docker run --rm \
            --env GITHUB_ACTIONS \
            --env MT_PLATFORM --env MT_ENV --env MT_TARGET \
            --env PLATFORMIO_BUILD_DIR \
            -v "$GITHUB_WORKSPACE:/workspace" \
            --entrypoint /bin/bash \
            "ghcr.io/fobe-projects/action-meshtastic-firmware-builder:master-$MT_PLATFORM" \
            -ec '
              python3 -m pip install --upgrade platformio==6.1.19
              if [[ "$MT_PLATFORM" == esp32* ]]; then
                python3 -m venv "$PLATFORMIO_CORE_DIR/penv"
                "$PLATFORMIO_CORE_DIR/penv/bin/python" -m pip install --upgrade pioarduino==6.1.19
              fi
              exec /entrypoint.sh
            '

      - name: Include unified ESP32 OTA firmware
        if: inputs.platform == 'esp32' || inputs.platform == 'esp32s3'
        working-directory: release
        env:
          PIO_PLATFORM: ${{ inputs.platform }}
          OTA_URL: https://github.com/meshtastic/esp32-unified-ota/releases/download/v1.0.1/mt-${{ inputs.platform }}-ota.bin
        run: |
          OTA_FILE="mt-${PIO_PLATFORM}-ota.bin"
          curl --fail --location --retry 3 --output "$OTA_FILE" "$OTA_URL"
          OTA_MD5=$(md5sum "$OTA_FILE" | cut -d' ' -f1)
          OTA_SIZE=$(stat -c%s "$OTA_FILE")
          for manifest in firmware-*.mt.json; do
            jq --arg name "$OTA_FILE" --arg md5 "$OTA_MD5" --argjson bytes "$OTA_SIZE" \
              '.files += [{name: $name, md5: $md5, bytes: $bytes, part_name: "app1"}]' \
              "$manifest" > "${manifest}.tmp"
            mv "${manifest}.tmp" "$manifest"
          done

      - name: Store binaries as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ inputs.platform }}-${{ inputs.pio_env }}-${{ inputs.version }}.zip
          overwrite: true
          path: |
            release/*.mt.json
            release/*.bin
            release/*.elf
            release/*.uf2
            release/*.hex
            release/*-ota.zip
