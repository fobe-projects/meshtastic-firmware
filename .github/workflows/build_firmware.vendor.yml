name: Vendor Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      platform:
        required: true
        type: string
      pio_env:
        required: true
        type: string

permissions: read-all

jobs:
  pio-build:
    name: build-${{ inputs.platform }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{github.event.pull_request.head.ref}}
          repository: ${{github.event.pull_request.head.repo.full_name}}

      - name: Set OTA firmware source and target
        if: startsWith(inputs.platform, 'esp32')
        id: ota_dir
        env:
          PIO_PLATFORM: ${{ inputs.platform }}
        run: |
          if [ "$PIO_PLATFORM" = "esp32s3" ]; then
            echo "src=firmware-s3.bin" >> $GITHUB_OUTPUT
            echo "tgt=release/bleota-s3.bin" >> $GITHUB_OUTPUT
          elif [ "$PIO_PLATFORM" = "esp32c3" ] || [ "$PIO_PLATFORM" = "esp32c6" ]; then
            echo "src=firmware-c3.bin" >> $GITHUB_OUTPUT
            echo "tgt=release/bleota-c3.bin" >> $GITHUB_OUTPUT
          elif [ "$PIO_PLATFORM" = "esp32" ]; then
            echo "src=firmware.bin" >> $GITHUB_OUTPUT
            echo "tgt=release/bleota.bin" >> $GITHUB_OUTPUT
          fi

      - name: Build ${{ inputs.platform }}
        id: build
        env:
          MT_PLATFORM: ${{ inputs.platform }}
          MT_ENV: ${{ inputs.pio_env }}
          MT_TARGET: build
          PLATFORMIO_BUILD_DIR: /workspace/.pio/build
        run: |
          docker run --rm \
            --env GITHUB_ACTIONS \
            --env MT_PLATFORM --env MT_ENV --env MT_TARGET \
            --env PLATFORMIO_BUILD_DIR \
            -v "$GITHUB_WORKSPACE:/workspace" \
            --entrypoint /bin/bash \
            "ghcr.io/fobe-projects/action-meshtastic-firmware-builder:master-$MT_PLATFORM" \
            -ec '
              python3 -m pip install --upgrade platformio==6.1.19
              if [[ "$MT_PLATFORM" == esp32* ]]; then
                python3 -m venv "$PLATFORMIO_CORE_DIR/penv"
                "$PLATFORMIO_CORE_DIR/penv/bin/python" -m pip install --upgrade pioarduino==6.1.19
              fi
              exec /entrypoint.sh
            '

      - name: Store binaries as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ inputs.platform }}-${{ inputs.pio_env }}-${{ inputs.version }}.zip
          overwrite: true
          path: |
            release/*.bin
            release/*.elf
            release/*.uf2
            release/*.hex
            release/*-ota.zip
